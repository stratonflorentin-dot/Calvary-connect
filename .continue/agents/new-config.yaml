name: Local Gemma Agent
version: 0.0.1
schema: v1

models:
  - name: Gemma Local
    provider: openai
    model: gemma-local
    apiBase: http://127.0.0.1:1234/v1
    apiKey: lm-studio
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply

context:
  - provider: code
  - provider: folder
  - provider: codebase
  - provider: diff
  - provider: terminal
  - provider: problems