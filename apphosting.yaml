# Calvary Connect — Firebase App Hosting Configuration
# Enterprise High-Availability Settings
# Target SLA: 99.99% uptime | 100K users | 20K concurrent
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Runtime: Node 20 LTS
  runtime: nodejs20

  # ── Autoscaling ──────────────────────────────────────────────────────────
  # Keep minimum 2 instances warm — eliminates cold starts for 24/7 operations
  minInstances: 2

  # Scale up to 50 instances at peak (supports ~20K concurrent users at 80 req/pod)
  maxInstances: 50

  # Concurrent requests per instance (tuned for Next.js + Firebase SDK)
  concurrency: 100

env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: production
  - variable: OTEL_SERVICE_NAME
    value: calvary-connect
  - variable: NODE_OPTIONS
    value: "--max-old-space-size=2048"
