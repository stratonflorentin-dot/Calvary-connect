name: GPS Sync

# Vercel's Hobby plan only allows once-daily Cron Jobs — far too infrequent
# to keep the fleet map live (it was silently going stale for hours between
# whoever last had /map open in a browser, since that page's own 60s
# refresh only runs while someone is actively looking at it). This polls
# the sync endpoint on a real schedule instead, authenticated with the
# shared CRON_SECRET (see src/app/api/telematics/sync/route.ts).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GPS sync
        run: |
          status=$(curl -s -o /tmp/sync_response.json -w "%{http_code}" -X POST \
            "https://calvary-connect.vercel.app/api/telematics/sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/sync_response.json
          if [ "$status" -ge 300 ]; then
            echo "Sync failed"
            exit 1
          fi
